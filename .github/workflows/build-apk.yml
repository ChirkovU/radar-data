name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Web Directory For Capacitor
        run: |
          mkdir www
          rsync -av --exclude='.github' --exclude='www' ./ www/

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/assets --save-dev

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.radarfrf.app", "appName": "RADAR FRF", "webDir": "www"}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Application Icons
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          elif [ -f "Icon.png" ]; then
            cp Icon.png assets/icon.png
          elif [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Icon file not found, skipping icon generation."
          fi

      - name: Update App Version to 0.8.1
        run: |
          cd android/app
          sed -i 's/versionName "1.0"/versionName "0.8.1"/' build.gradle
          sed -i 's/versionCode 1/versionCode 81/' build.gradle

      - name: Sync Web Code to Android
        run: npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Изменено: Собираем релизную версию вместо дебага
      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # НОВЫЙ ШАГ: Подпись APK (без этого релизный APK не установится)
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Изменено: Загружаем подписанный релизный APK
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: RADAR_FRF_v0.8.1-Release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
