name: Сборка ВРВ Радар APK

on:
  workflow_dispatch: # Ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 24 (Актуальная версия 2026)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Установка Cordova
        run: npm install -g cordova

      - name: Создание проекта Cordova
        run: |
          cordova create build_folder com.vrv.radar "РАДАР"
          cd build_folder
          cordova platform add android --noscript

      - name: Копирование файлов радара и иконки
        run: |
          # 1. Очищаем дефолтную папку Cordova и закидываем файлы
          rm -rf build_folder/www/*
          cp index.html build_folder/www/
          cp db.js build_folder/www/
          
          # 2. Переносим папку с картинками
          if [ -d "images" ]; then cp -r images build_folder/www/; fi
          
          # 3. Переносим иконку в папку проекта
          cp icon.png build_folder/www/icon.png
          
          # 4. Полностью перезаписываем config.xml правильной структурой, чтобы не ломать теги
          cat <<EOF > build_folder/config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.vrv.radar" version="1.0.0" xmlns="http://w3.org" xmlns:cdv="http://apache.org">
              <name>РАДАР</name>
              <description>Система мониторинга воздушной обстановки.</description>
              <author email="dev@vrv.radar" href="https://vrv.radar">ВРВ Команда</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="LogLevel" value="DEBUG" />
              <platform name="android">
                  <icon src="www/icon.png" />
              </platform>
          </widget>
          EOF

      - name: Настройка Java (Обновлено до v5 для Node 24)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: Финальная компиляция APK
        run: |
          cd build_folder
          cordova build android --debug

      - name: Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: VRV_Radar_APK
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
