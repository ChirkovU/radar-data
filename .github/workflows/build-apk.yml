name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Web Directory For Capacitor
        run: |
          mkdir www
          # Копируем всё содержимое, кроме системных папок гитхаба и самой папки www
          rsync -av --exclude='.github' --exclude='www' ./ www/

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.radar.app", "appName": "Radar App", "webDir": "www"}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Code to Android
        run: npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
