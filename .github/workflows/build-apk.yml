name: Сборка ВРВ Радар APK

on:
  workflow_dispatch: # Ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 24 (Актуальная версия 2026)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Установка Cordova
        run: npm install -g cordova

      - name: Создание проекта Cordova
        run: |
          # В конце строки в кавычках укажите ЛЮБОЕ новое название приложения
          cordova create build_folder com.vrv.radar "РАДАР"
          cd build_folder
          cordova platform add android --noscript

      - name: Копирование файлов радара и иконки
        run: |
          rm -rf build_folder/www/*
          cp index.html build_folder/www/
          cp db.js build_folder/www/
          cp -r images build_folder/www/
          
          # Копируем иконку в корень проекта и прописываем её в конфиг Cordova
          cp icon.png build_folder/icon.png
          echo '<platform name="android"><icon src="icon.png" /></platform>' >> build_folder/config.xml

      - name: Настройка Java (Обновлено до v5 для Node 24)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: Финальная компиляция APK
        run: |
          cd build_folder
          cordova build android --debug

      - name: Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: VRV_Radar_APK
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
