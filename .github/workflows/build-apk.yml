name: Сборка ВРВ Радар APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v5

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установка Cordova
        run: npm install -g cordova

      - name: Создание проекта Cordova
        run: |
          cordova create build_folder com.vrv.radar VRV_Radar
          cd build_folder
          cordova platform add android --noscript

      - name: Копирование файлов радара
        run: |
          rm -rf build_folder/www/*
          cp index.html build_folder/www/
          cp db.js build_folder/www/

      - name: Настройка Java для Android
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: Финальная компиляция APK
        run: |
          cd build_folder
          cordova build android

      - name: Сохранение готового файла (Универсальный поиск)
        uses: actions/upload-artifact@v4
        with:
          name: VRV_Radar_APK
          # Маска **/*.apk заставит сервер обыскать всю папку и забрать любой готовый APK
          path: build_folder/**/*.apk
